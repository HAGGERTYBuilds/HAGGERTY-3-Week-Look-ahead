<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Haggerty Look-Ahead</title>
<meta name="theme-color" content="#F7943F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Look-Ahead">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600;700&display=swap">
<style>
html{height:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}
/* Layout: one app bar, then a working surface. Dashboard = all jobs on one grid; job = tap-to-fill day grid; sheets = printable paper pages. */
:root{
  --bg:#F4F3F1; --surface:#FFFFFF; --surface-2:#ECEAE6; --line:#DCD8D2; --line-2:#C9C4BC;
  --ink:#262727; --ink-2:#615E59; --brand:#F7943F; --brand-ink:#A9560E; --brand-soft:#FDE9D6;
  --mark:#4D4E4E; --blue:#1764F4; --blue-soft:#DCE7FE; --red:#E0262B; --red-soft:#FBDCDD;
  --weekend:#EBE8E3; --scrim:rgba(20,20,20,.45); --shadow:0 1px 2px rgba(40,30,20,.08),0 6px 24px rgba(40,30,20,.08);
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#151616; --surface:#1F2121; --surface-2:#292B2B; --line:#363939; --line-2:#4A4D4D;
  --ink:#EDECEA; --ink-2:#A8A59F; --brand:#F7943F; --brand-ink:#F8A660; --brand-soft:#3A2A1C;
  --mark:#E2E1DF; --blue:#3B7DFF; --blue-soft:#1C2B4A; --red:#F0443F; --red-soft:#4A2021;
  --weekend:#252727; --scrim:rgba(0,0,0,.6); --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#151616; --surface:#1F2121; --surface-2:#292B2B; --line:#363939; --line-2:#4A4D4D;
  --ink:#EDECEA; --ink-2:#A8A59F; --brand:#F7943F; --brand-ink:#F8A660; --brand-soft:#3A2A1C;
  --mark:#E2E1DF; --blue:#3B7DFF; --blue-soft:#1C2B4A; --red:#F0443F; --red-soft:#4A2021;
  --weekend:#252727; --scrim:rgba(0,0,0,.6); --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.4;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* App bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;
  display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--mark);border:0;background:none;padding:0}
.logo svg{height:28px;width:auto;display:block}
.logo b{font-family:var(--f-display);font-weight:700;font-size:24px;letter-spacing:.04em;line-height:1}
.logo small{display:block;font-size:10px;letter-spacing:.14em;color:var(--brand-ink);font-weight:600;text-transform:uppercase;margin-top:2px}
.nav{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
.nav button{border:0;background:none;padding:8px 12px;border-radius:8px;font-weight:600;color:var(--ink-2)}
.nav button[aria-current="true"]{background:var(--brand-soft);color:var(--brand-ink)}

main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 60px;max-width:1400px;margin:0 auto}
h1,h2,h3{font-family:var(--f-display);font-weight:700;letter-spacing:.01em;margin:0;text-wrap:balance}
h1{font-size:30px;line-height:1.1}
h2{font-size:22px}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--brand-ink)}
.muted{color:var(--ink-2)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}

.btn{border:1px solid var(--line-2);background:var(--surface);padding:9px 14px;border-radius:9px;font-weight:600;min-height:40px;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--ink-2)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#231507}
.btn.primary:hover{filter:brightness(.96)}
.btn.ghost{border-color:transparent;background:none}
.btn.sm{min-height:32px;padding:5px 10px;font-size:13px;border-radius:7px}
.btn.danger{color:var(--red);border-color:var(--red)}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:10px;padding:3px;background:var(--surface);gap:2px}
.seg button{border:0;background:none;padding:6px 12px;border-radius:7px;font-weight:600;color:var(--ink-2);min-height:34px;display:inline-flex;align-items:center;gap:6px}
.seg button[aria-pressed="true"]{background:var(--surface-2);color:var(--ink)}
.sw{display:inline-block;width:14px;height:14px;border-radius:3px;border:1px solid var(--line-2)}
.sw.b{background:var(--blue);border-color:var(--blue)}.sw.r{background:var(--red);border-color:var(--red)}
.pill{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:999px;border:1px solid var(--line-2);color:var(--ink-2);white-space:nowrap}
.pill.res{border-color:var(--brand);color:var(--brand-ink)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;flex:none}
input[type=text],input[type=date],select{border:1px solid var(--line-2);background:var(--surface);border-radius:8px;padding:7px 9px;min-height:38px}
label.chk{display:inline-flex;align-items:center;gap:6px;font-weight:500}
label.chk input{width:18px;height:18px;accent-color:var(--brand)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:14px 0}
.scroller{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.hint{font-size:13px;color:var(--ink-2)}
.example{font-size:12px;color:var(--ink-2);border:1px dashed var(--line-2);border-radius:8px;padding:6px 10px}

/* Stats */
.stats{display:flex;gap:28px;flex-wrap:wrap;margin:6px 0 4px}
.stat b{font-family:var(--f-display);font-size:28px;line-height:1;display:block}
.stat span{font-size:12px;color:var(--ink-2);text-transform:uppercase;letter-spacing:.08em;font-weight:600}

/* Grids (shared by gantt + job editor) */
table.grid{border-collapse:separate;border-spacing:0;font-size:13px;min-width:100%}
.grid th,.grid td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:0;height:38px;background:var(--surface)}
.grid thead th{background:var(--surface-2);font-weight:600;color:var(--ink-2);position:sticky;top:0;z-index:2}
.grid thead tr.mo th{height:24px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;text-align:left;padding-left:6px;color:var(--ink)}
.grid thead tr.dy th{height:40px}
.grid th.dh{width:34px;min-width:34px;text-align:center;line-height:1.05;font-size:11px}
.grid th.dh b{display:block;font-size:14px;color:var(--ink)}
.grid .we{background:var(--weekend)}
.grid thead th.we{background:var(--weekend)}
.grid .wk{border-left:2px solid var(--line-2)}
.grid th.dh.today{background:var(--brand);color:#231507}
.grid th.dh.today b{color:#231507}
.grid td.today{box-shadow:inset 2px 0 0 var(--brand),inset -2px 0 0 var(--brand)}
.stick{position:sticky;left:0;z-index:1}
thead .stick{z-index:3}
.grid td.d{width:34px;min-width:34px;cursor:pointer;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.grid.paint td.d{touch-action:none}
.grid td.d.b{background:var(--blue)}
.grid td.d.r{background:var(--red)}
.grid td.d:hover:not(.b):not(.r){background:var(--blue-soft)}
.grid td.d.b.today,.grid td.d.r.today{box-shadow:inset 2px 0 0 var(--brand),inset -2px 0 0 var(--brand)}

/* editor left columns */
.c-id{width:40px;min-width:40px;text-align:center;color:var(--ink-2);font-variant-numeric:tabular-nums}
.c-task{min-width:210px;width:230px;left:40px}
.c-res{min-width:120px;width:130px}
.c-dt{min-width:62px;width:62px;text-align:center;font-variant-numeric:tabular-nums;color:var(--ink-2);font-size:12.5px}
.c-act{width:40px;min-width:40px;text-align:center}
.grid td input.cell{border:0;background:transparent;width:100%;height:37px;padding:0 8px;border-radius:0;min-height:0}
.grid td input.cell:focus{background:var(--brand-soft);outline:none}
tr.sec td{background:var(--surface-2)}
tr.sec input.cell{font-family:var(--f-display);font-weight:700;font-size:15px;letter-spacing:.06em;text-transform:uppercase}
tr.sec td.secfill{background:var(--surface-2)}
.dep{font-size:11px;color:var(--ink-2);padding:0 8px;display:block;margin-top:-10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{border:0;background:none;width:36px;height:36px;border-radius:8px;color:var(--ink-2);font-size:18px;line-height:1}
.iconbtn:hover{background:var(--surface-2);color:var(--ink)}

/* gantt */
.g-job{min-width:260px;width:280px;padding:6px 10px!important}
.g-job .nm{font-weight:700;display:flex;gap:8px;align-items:center}
.g-job .sub{font-size:12px;color:var(--ink-2);display:flex;gap:8px;align-items:center;margin-top:2px}
.g-job .acts{display:flex;gap:6px;margin-top:6px}
tr.jobrow td.d{cursor:pointer}
td.sum{position:relative}
td.sum.sb{background:var(--blue-soft)} td.sum.sr{background:var(--red-soft)}
td.sum i{position:absolute;left:4px;right:4px;top:50%;height:12px;margin-top:-6px;border-radius:3px;background:var(--blue)}
td.sum.sr i{background:var(--red)}
td.sum em{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:10px;font-weight:700;color:#fff;font-variant-numeric:tabular-nums}
tr.taskrow th{font-weight:500;font-size:13px;text-align:left;padding:0 10px 0 30px!important;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:280px}
tr.taskrow td{height:28px}

/* week + today */
.week{display:grid;grid-template-columns:repeat(var(--cols),minmax(150px,1fr));gap:10px;min-width:calc(var(--cols)*160px)}
.daycol{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px;min-width:0}
.daycol.today{border-color:var(--brand);box-shadow:inset 0 3px 0 var(--brand)}
.daycol.we{background:var(--weekend)}
.daycol h3{font-size:18px;display:flex;justify-content:space-between;align-items:baseline}
.chip{border:1px solid var(--line);border-left:4px solid var(--c);border-radius:8px;padding:6px 8px;background:var(--surface);text-align:left;width:100%;display:block}
.chip .j{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-2)}
.chip .t{font-size:13px;display:flex;gap:6px;align-items:center;min-width:0}
.chip .t span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.card ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.card li{display:flex;gap:8px;align-items:center;font-size:14px}
.empty{color:var(--ink-2);font-size:13px}

/* job header */
.jobhead{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;padding:14px;margin-top:12px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field span{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2)}
.field input{width:100%}

/* modal */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:50;display:flex;align-items:flex-end;justify-content:center;padding:16px;padding-bottom:max(16px,env(safe-area-inset-bottom,0px))}
@media (min-width:700px){.scrim{align-items:center}}
.modal{background:var(--surface);border-radius:14px;box-shadow:var(--shadow);width:min(520px,100%);max-height:85vh;overflow:auto;padding:20px;display:flex;flex-direction:column;gap:14px}
.modal .field select,.modal .field input{width:100%}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;z-index:60;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
.legend{display:flex;gap:14px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--ink-2)}
.legend span{display:inline-flex;gap:6px;align-items:center}

/* Paper sheets: deliberately always light, like the printed page */
.sheets{display:flex;flex-direction:column;gap:22px;align-items:flex-start}
.sheetwrap{max-width:100%;overflow-x:auto;border-radius:6px;box-shadow:var(--shadow)}
.sheet{width:1056px;min-height:600px;background:#fff;color:#1f1f1f;padding:30px 32px;font-family:var(--f-body);font-size:12px;display:flex;flex-direction:column;gap:14px}
.sheet .sh-top{display:flex;align-items:flex-start;gap:20px;border-bottom:3px solid #F7943F;padding-bottom:12px}
.sheet .sh-logo{display:flex;align-items:center;gap:8px;color:#4D4E4E}
.sheet .sh-logo svg{height:34px;width:auto}
.sheet .sh-logo b{font-family:var(--f-display);font-size:28px;letter-spacing:.04em;line-height:1}
.sheet .sh-logo small{display:block;font-size:9px;letter-spacing:.14em;color:#C66A1C;font-weight:700;margin-top:2px}
.sheet .sh-title{margin-left:auto;text-align:right}
.sheet .sh-title h2{font-size:24px;color:#1f1f1f}
.sheet .sh-meta{display:grid;grid-template-columns:repeat(4,1fr);gap:4px 18px}
.sheet .sh-meta div{border-bottom:1px solid #ddd;padding:3px 0;display:flex;gap:8px;min-width:0}
.sheet .sh-meta span{font-weight:700;color:#666;text-transform:uppercase;font-size:10px;letter-spacing:.08em;flex:none;padding-top:1px}
.sheet table{border-collapse:collapse;width:100%;table-layout:fixed;font-size:11.5px}
.sheet th,.sheet td{border:1px solid #cfcfcf;height:22px;padding:0 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sheet thead th{background:#F1F0EE;font-size:10px;color:#444}
.sheet th.d,.sheet td.d{padding:0;text-align:center;width:22px}
.sheet .we{background:#F1F0EE}
.sheet .tdy{outline:2px solid #F7943F;outline-offset:-2px}
.sheet td.b{background:#1764F4}.sheet td.r{background:#E0262B}
.sheet tr.sec td{background:#4D4E4E;color:#fff;font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:10.5px}
.sheet .sh-foot{margin-top:auto;display:flex;justify-content:space-between;color:#777;font-size:10px;border-top:1px solid #ddd;padding-top:8px}
.sheet .lg{display:flex;gap:14px;align-items:center}
.sheet .lg i{display:inline-block;width:12px;height:12px;vertical-align:-2px;margin-right:4px}

@media print{
  .sheet tbody tr{break-inside:avoid}
  @page{size:letter landscape;margin:.3in}
  body{background:#fff}
  .bar,.noprint,.toast{display:none!important}
  main{padding:0;max-width:none}
  .sheetwrap{box-shadow:none;overflow:visible}
  .sheet{width:100%;page-break-after:always;padding:0}
  .sheetwrap:last-child .sheet{page-break-after:auto}
}
@media (max-width:640px){h1{font-size:24px}.logo small{display:none}.nav{margin-left:0;width:100%}.nav button{flex:1}}
@media (prefers-reduced-motion:no-preference){.btn,.seg button,.nav button{transition:background .12s,border-color .12s}}
.sync{font-size:12px;font-weight:600;color:var(--ink-2);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.sync i{width:8px;height:8px;border-radius:50%;background:#3BA55C;display:inline-block}
.sync.busy i{background:var(--brand)}.sync.off i{background:var(--red)}
.who{border:1px solid var(--line-2);background:var(--surface);border-radius:999px;padding:5px 12px;font-weight:600;font-size:13px}
.login{max-width:420px;margin:8vh auto 0;display:flex;flex-direction:column;gap:16px}
.login input{font-size:22px;letter-spacing:.2em;text-transform:uppercase;text-align:center;padding:12px}
.err{color:var(--red);font-weight:600}
.sent{font-size:11px;font-weight:700;color:#2F8F4E;letter-spacing:.04em}
table.plain{border-collapse:collapse;width:100%}
table.plain th,table.plain td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line)}
table.plain th{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2)}
@media (pointer:coarse){.btn{min-height:44px}.btn.sm{min-height:38px}.seg button{min-height:40px}
  .grid td.d,.grid th.dh{width:40px;min-width:40px}.grid th,.grid td{height:44px}.grid td input.cell{height:43px}.iconbtn{width:42px;height:42px}}
.help{background:var(--brand-soft);border:1px solid var(--brand);border-radius:12px;padding:14px 16px;margin:12px 0;display:flex;gap:14px;align-items:flex-start}
.help ol{margin:4px 0 0;padding-left:20px}.help li{margin:3px 0}
.help h3{margin:0;font-size:17px}
.ro{display:flex;flex-direction:column;gap:2px}.ro b{font-weight:600;font-size:16px}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden}
.linkbox{font-family:ui-monospace,Menlo,monospace;font-size:13px;background:var(--surface-2);padding:10px 12px;border-radius:8px;word-break:break-all;user-select:all}
.big{font-size:17px;min-height:52px;padding:12px 18px}
.imsum{background:var(--surface-2);border-radius:10px;padding:10px 12px;font-size:14px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin:14px 0}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.tile b{display:block;font-family:var(--f-display);font-size:32px;line-height:1.1}.tile span{font-size:12px;color:var(--ink-2);font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.tile small{display:block;color:var(--ink-2);font-size:12px;margin-top:2px}
.split{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px;margin:12px 0}
.split .panel{padding:14px 16px}.split dl{display:grid;grid-template-columns:1fr auto;gap:4px 12px;margin:8px 0 0}.split dd{margin:0;font-weight:700;text-align:right}
.load th,.load td{border-bottom:1px solid var(--line);padding:0;height:44px;background:var(--surface)}
.load td.h{width:30px;min-width:30px;text-align:center;font-size:11px;font-weight:700;border-right:1px solid var(--surface)}
.load td.h.cr{box-shadow:inset 0 -4px 0 var(--red)}
.load .wh{padding:6px 10px;text-align:left;min-width:150px}.load .n{padding:0 8px;text-align:center;font-variant-numeric:tabular-nums}
.load tr[data-sup]{cursor:pointer}.load tr[data-sup]:hover th,.load tr[data-sup]:hover td.n{background:var(--surface-2)}
.lst{list-style:none;margin:0;padding:0}.lst li{display:flex;gap:10px;align-items:baseline;padding:8px 2px;border-bottom:1px solid var(--line)}
.lst .dt{font-weight:700;min-width:84px;font-variant-numeric:tabular-nums}.lst button{all:unset;cursor:pointer;font-weight:600}.lst button:hover{text-decoration:underline}
.warn{color:#B4540C;font-weight:600}
a.btn{text-decoration:none;color:inherit}
.row>.field{flex:1}
table.trips td.r,table.trips th.r{text-align:right}table.trips td.num,table.trips td.r{white-space:nowrap}table.trips tbody tr{cursor:pointer}table.trips tbody tr:hover td{background:var(--surface-2)}

<script>
(function(){
"use strict";
const LOGO='<svg viewBox="0 0 124 124" aria-hidden="true"><rect x="0" y="94" width="30" height="30" fill="#F7943F"/><rect x="47" y="46" width="30" height="30" fill="#F7943F"/><rect x="47" y="94" width="30" height="30" fill="#F7943F"/><rect x="94" y="0" width="30" height="124" fill="#F7943F"/></svg>';
const MONTHS=["January","February","March","April","May","June","July","August","September","October","November","December"];
const MO=MONTHS.map(m=>m.slice(0,3));
const DOW=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const JOBCOLORS=["#F7943F","#2E9E8F","#7A5BD6","#D64B7A","#3D8BD9","#8C9A2B","#C2582E","#4F6D7A","#B8860B","#5A8F4E"];

/* ---------- dates (local, string keys YYYY-MM-DD) ---------- */
const k=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const p=s=>{const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};
const add=(s,n)=>{const d=p(s);d.setDate(d.getDate()+n);return k(d)};
const dow=s=>p(s).getDay();
const isWE=s=>{const g=dow(s);return g===0||g===6};
const mondayOf=s=>add(s,-((dow(s)+6)%7));
const addWork=(s,n,we)=>{if(we)return add(s,n);let st=n>0?1:-1,c=Math.abs(n),d=s;while(c>0){d=add(d,st);if(!isWE(d))c--}return d};
const nextWork=(s,we)=>{let d=s;if(!we)while(isWE(d))d=add(d,1);return d};
const fmt=s=>s?MO[p(s).getMonth()]+" "+p(s).getDate():"";
const fmtLong=s=>DOW[dow(s)]+", "+MO[p(s).getMonth()]+" "+p(s).getDate();
const TODAY=k(new Date());
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>(crypto.randomUUID?crypto.randomUUID():"10000000-1000-4000-8000-100000000000".replace(/[018]/g,c=>(c^crypto.getRandomValues(new Uint8Array(1))[0]&15>>c/4).toString(16)));
/* Supabase ("3-week-Lookahead" project). The publishable key is meant to be public:
   tables are deny-all and every call goes through la_* functions that check the super's access code. */
const SB_URL="https://paumntdfhkgfvotbejbj.supabase.co";
const SB_KEY="sb_publishable_uEDZDy67o9Q1F-LxmXgNOg_paDyab12";
async function rpc(fn,args){
  const r=await fetch(SB_URL+"/rest/v1/rpc/"+fn,{method:"POST",headers:{apikey:SB_KEY,"Content-Type":"application/json"},body:JSON.stringify(args)});
  const txt=await r.text();
  if(!r.ok){let m="";try{m=JSON.parse(txt).message}catch(e){}const err=new Error(m||("Server error "+r.status));err.status=r.status;throw err}
  return txt?JSON.parse(txt):null}

/* ---------- example data, built relative to this week ---------- */
const SUPNAME=()=>(S.me&&S.me.name)||"Superintendent A";
function seed(){
  const mon=mondayOf(TODAY);
  const W=[];for(let d=mon;W.length<40;d=add(d,1))if(!isWE(d))W.push(d);
  const T=(name,res,o,len,opt={})=>{const t={id:uid(),name,res,after:null,cells:{}};
    if(len)for(let i=0;i<len;i++)t.cells[W[Math.max(0,o+i)]]=(opt.r&&opt.r.includes(i))||opt.allR?"R":"B";
    if(opt.sec){t.sec=true;delete t.cells}return t};
  const S=name=>({id:uid(),name,sec:true,cells:{}});
  const link=(arr)=>{for(let i=1;i<arr.length;i++)if(!arr[i].sec&&arr[i].link!==undefined)arr[i].after=arr[arr[i].link].id;arr.forEach(t=>delete t.link);return arr};
  const L=(t,i)=>(t.link=i,t);
  const jobs=[
    {name:"123 Main St, Stockton",number:"24-118 RCN",mode:"res",cm:"Claims Manager",sup:SUPNAME(),tasks:link([
      T("Final moisture readings","Mitigation crew",0,1,{allR:true}),
      L(T("Demo","Haggerty crew",1,2),0),
      L(T("Framing repairs","Haggerty crew",2,2),1),
      L(T("Electrical repairs","ABC Electric",3,2),2),
      L(T("Insulation","Insulator",5,1),3),
      L(T("Insulation inspection","City inspector",6,1,{allR:true}),4),
      L(T("Hang drywall","Drywall sub",7,2),5),
      L(T("Tape, texture","Drywall sub",9,3),6),
      L(T("Prime and paint","Painter",12,3),7),
      L(T("Final walk with adjuster","Super / CM",15,1,{allR:true}),8)])},
    {name:"48 Oak Ridge Ct, Lodi",number:"24-131 FIRE",mode:"res",cm:"Claims Manager",sup:SUPNAME(),tasks:link([
      T("Contents pack-out","Pack-out crew",0,3),
      L(T("Soot and smoke cleaning","Cleaning crew",3,4),0),
      T("Roof tear-off and dry-in","Roofer",4,3,{r:[2]}),
      L(T("Electrical rough","ABC Electric",7,3),1),
      L(T("Rough inspection","City inspector",10,1,{allR:true}),3),
      L(T("Insulation and drywall","Drywall sub",11,5),4)])},
    {name:"917 Pacific Ave, Stockton",number:"24-140 RCN",mode:"res",cm:"Claims Manager",sup:SUPNAME(),tasks:link([
      T("Cabinet tear-out","Haggerty crew",1,1),
      L(T("Plumbing repair","Plumber",2,2),0),
      L(T("Drywall patch","Drywall sub",4,2),1),
      L(T("Cabinet delivery","Supplier",8,1,{allR:true}),2),
      L(T("Cabinet install","Cabinet installer",9,2),3),
      L(T("Countertop template","Counter fab",11,1,{allR:true}),4)])},
    {name:"2210 Grand Canal Blvd",number:"24-152 MOLD",mode:"res",cm:"Claims Manager",sup:SUPNAME(),tasks:link([
      T("Containment setup","Remediation crew",0,1),
      L(T("Mold removal","Remediation crew",1,3),0),
      L(T("Clearance test","Hygienist",4,1,{allR:true}),1),
      L(T("Rebuild walls","Haggerty crew",6,4),2)])},
    {name:"UOP Jie Du Inn",number:"C-2207",mode:"com",cm:"Project Manager",sup:SUPNAME(),tasks:link([
      S("Submittals"),
      T("Electrical","ABC Electric",0,2),
      T("Plumbing","Plumber",1,2),
      T("HVAC","Mech sub",3,4),
      T("Fire protection","Fire sprinkler sub",3,3,{r:[2]}),
      T("Windows","Glazing sub",1,5),
      S("Third floor"),
      T("Frame walls","Framing sub",2,4),
      L(T("Electrical rough","ABC Electric",5,4),7),
      L(T("Plumbing rough","Plumber",9,3),7),
      L(T("Fire protection rough","Fire sprinkler sub",7,3),7),
      S("Second floor"),
      T("Frame walls","Framing sub",2,7),
      L(T("Electrical rough","ABC Electric",9,5),12),
      L(T("HVAC rough","Mech sub",14,4),12),
      S("Inspections"),
      L(T("Third floor rough inspection","City inspector",12,1,{allR:true}),9)])},
    {name:"Lodi Unified Admin TI",number:"C-2214",mode:"com",cm:"Project Manager",sup:SUPNAME(),tasks:link([
      S("Demo"),
      T("Demo ceilings and walls","Haggerty crew",0,3),
      S("Rough-in"),
      L(T("Electrical rough","ABC Electric",3,4),1),
      L(T("Data cabling","Low voltage sub",5,3),3),
      L(T("Above-ceiling inspection","City inspector",8,1,{allR:true}),3),
      S("Finishes"),
      L(T("Ceiling grid and tile","Acoustical sub",9,4),5),
      L(T("Paint","Painter",11,3),7)])}
  ];
  jobs.forEach((j,i)=>{j.id=uid();j.color=JOBCOLORS[i%JOBCOLORS.length];j.weekends=false;j.example=true;
    j.tasks.forEach(t=>{if(!t.cells)t.cells={}});reflow(j);});
  return jobs;
}

/* ---------- state ---------- */
const KEY="haggerty-lookahead-v2",CODEKEY="haggerty-lookahead-code";
let S={me:null,code:null,demo:false,supers:[],superFilter:"all",synced:{},archived:[],jobs:[],start:mondayOf(TODAY),weeks:3,hideWE:false,view:"dash",tab:"gantt",jobId:null,brush:"cycle",filter:"all",open:{},sheetIds:null};
const ls={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
function cacheKey(){return KEY+":"+(S.demo?"demo":S.me&&S.me.id)}
function persist(){ls.set(cacheKey(),JSON.stringify({jobs:S.jobs,synced:S.synced,archived:S.archived,supers:S.supers}));ls.set(KEY+":prefs",JSON.stringify({weeks:S.weeks,hideWE:S.hideWE}))}
function loadPrefs(){try{const p=JSON.parse(ls.get(KEY+":prefs")||"{}");S.weeks=p.weeks||3;S.hideWE=!!p.hideWE}catch(e){}}
function loadCache(){try{const d=JSON.parse(ls.get(cacheKey())||"null");if(d){S.jobs=d.jobs||[];S.synced=d.synced||{};S.archived=d.archived||[];S.supers=d.supers||[];return true}}catch(e){}return false}
/* jobJSON is what the server stores; a job is dirty when it differs from the last copy the server accepted */
const jobJSON=(j,i)=>JSON.stringify({id:j.id,superId:j.superId||null,number:j.number||"",name:j.name||"",mode:j.mode,cm:j.cm||"",sup:j.sup||"",color:j.color,weekends:!!j.weekends,sort:i,
  tasks:j.tasks.map(t=>({id:t.id,name:t.name||"",res:t.res||"",sec:!!t.sec,after:t.after||null,cells:t.cells||{}}))});
function save(){persist();if(!S.demo&&!isViewer())scheduleSync()}
let syncTimer=null,syncing=false;
function setSync(state,text){const el=$("#sync");if(!el)return;el.hidden=S.demo||!S.me;el.className="sync"+(state?" "+state:"");el.querySelector("span").textContent=text}
function pending(){return S.archived.length+S.jobs.filter((j,i)=>S.synced[j.id]!==jobJSON(j,i)).length}
function scheduleSync(){clearTimeout(syncTimer);setSync("busy","Saving…");syncTimer=setTimeout(syncNow,700)}
async function syncNow(){
  if(syncing||S.demo||!S.code||isViewer()){return}
  syncing=true;
  try{
    while(S.archived.length){await rpc("la_archive_job",{p_code:S.code,p_job_id:S.archived[0]});S.archived.shift();persist()}
    for(let i=0;i<S.jobs.length;i++){const j=S.jobs[i],body=jobJSON(j,i);if(S.synced[j.id]===body)continue;
      const sent=JSON.parse(body),saved=await rpc("la_save_job",{p_code:S.code,p_job:sent});
      /* the server fills in who owns a new job; record that as synced so it isn't saved again */
      if(saved){if(j.superId==sent.superId)j.superId=saved.superId;j.rev=saved.rev;sent.superId=saved.superId}S.synced[j.id]=JSON.stringify(sent);persist()}
    setSync("","All changes saved")
  }catch(e){
    if(e.status===401||e.status===403||/access code/i.test(e.message)){setSync("off","Signed out");signOut("Your access code no longer works. Ask Liam for a new one.");}
    else{setSync("off",navigator.onLine===false?"No signal · saved on this iPad":"Not sent yet · will retry");clearTimeout(syncTimer);syncTimer=setTimeout(syncNow,15000)}
  }finally{syncing=false}
  if(pending()&&!syncTimer)scheduleSync()
}
window.addEventListener("online",()=>{if(pending())syncNow()});
async function pull(){
  const d=await rpc("la_get_jobs",{p_code:S.code});
  const server=d.jobs||[];S.supers=d.supers||[];
  /* keep local edits that have not reached the server yet */
  const local=new Map(S.jobs.map((j,i)=>[j.id,{j,i}]));
  const merged=server.map(sj=>{const l=local.get(sj.id);if(l&&S.synced[sj.id]!==jobJSON(l.j,l.i))return l.j;
    S.synced[sj.id]=null;const j={...sj,tasks:(sj.tasks||[]).map(t=>({...t,cells:t.cells||{}}))};return j});
  S.jobs.forEach((j,i)=>{if(!server.some(x=>x.id===j.id)&&!S.synced[j.id]&&!S.archived.includes(j.id))merged.push(j)});
  S.jobs=merged.filter(j=>!S.archived.includes(j.id));
  S.jobs.forEach((j,i)=>{const sj=server.find(x=>x.id===j.id);if(sj&&S.synced[j.id]===null)S.synced[j.id]=jobJSON(j,i)});
  persist();if(pending())scheduleSync();else setSync("","All changes saved")}
function superName(id){const x=S.supers.find(s=>s.id===id);return x?x.name:""}const job=id=>S.jobs.find(j=>j.id===id);
const isAdmin=()=>S.demo||!!(S.me&&S.me.isAdmin);
const isViewer=()=>!S.demo&&!!(S.me&&S.me.role==="viewer");
const canLead=()=>isAdmin()||isViewer();
const SCOPE={all:"All jobs",com:"Commercial",res:"Restoration"};
const crew=()=>S.supers.filter(x=>x.role!=="viewer");
const DIV={res:"Restoration",com:"Commercial",all:"Both"};
/* a super tagged Restoration or Commercial decides the type of every job they run */
const divOf=id=>{const x=S.supers.find(s=>s.id===id);return x&&x.role!=="viewer"&&(x.scope==="res"||x.scope==="com")?x.scope:null};
function followDiv(selId,attr){const e=document.getElementById(selId);if(!e)return null;
  const apply=()=>{const d=divOf(e.value);if(!d)return;document.querySelectorAll("["+attr+"]").forEach(b=>{b.setAttribute("aria-pressed",b.getAttribute(attr)===d);if(b.getAttribute(attr)===d)b.click()})};
  e.addEventListener("change",apply);apply()}
const firstName=()=>((S.me&&S.me.name)||"").split(/\s+/)[0];
const curJob=()=>job(S.jobId)||S.jobs[0];

const days=()=>{const out=[];for(let i=0;i<S.weeks*7;i++){const d=add(S.start,i);if(S.hideWE&&isWE(d))continue;out.push(d)}return out};
const tStart=t=>{const ks=Object.keys(t.cells||{});return ks.length?ks.sort()[0]:""};
const tEnd=t=>{const ks=Object.keys(t.cells||{});return ks.length?ks.sort()[ks.length-1]:""};
const labels=j=>j.mode==="com"?{id:"Item",task:"Activity",res:"Responsible",cm:"PM",kind:"Commercial"}:{id:"ID",task:"Task name",res:"Resource",cm:"Claims mgr",kind:"Restoration"};

/* ---------- scheduling logic: shifts and auto-adjust ---------- */
function shiftTask(j,t,n){if(!n)return;const c={};for(const [d,v] of Object.entries(t.cells))c[addWork(d,n,j.weekends)]=v;t.cells=c}
function dependents(j,t){return j.tasks.filter(x=>x.after===t.id)}
function shiftWithDeps(j,t,n,seen=new Set()){if(seen.has(t.id))return;seen.add(t.id);shiftTask(j,t,n);dependents(j,t).forEach(x=>shiftWithDeps(j,x,n,seen))}
/* push any task that now starts on/before its predecessor's finish to the next workday after it */
function reflow(j){const moved=new Set();for(let guard=0;guard<60;guard++){let ch=false;
  for(const t of j.tasks){if(!t.after||t.sec)continue;const pr=j.tasks.find(x=>x.id===t.after);if(!pr)continue;
    const pe=tEnd(pr),ts=tStart(t);if(!pe||!ts||ts>pe)continue;
    const target=addWork(pe,1,j.weekends);let n=0,d=nextWork(ts,j.weekends);while(d<target){d=addWork(d,1,j.weekends);n++}
    if(n<1)n=1;shiftTask(j,t,n);moved.add(t.id);ch=true}
  if(!ch)break}return moved.size}
function lostDay(j,from){let count=0;for(const t of j.tasks){const c={};let hit=false;for(const [d,v] of Object.entries(t.cells||{})){if(d>=from){c[addWork(d,1,j.weekends)]=v;hit=true}else c[d]=v}
  if(hit){t.cells=c;count++}}reflow(j);return count}
function isAncestor(j,maybeAnc,t){let cur=maybeAnc,seen=new Set();while(cur&&!seen.has(cur.id)){if(cur.id===t.id)return true;seen.add(cur.id);cur=j.tasks.find(x=>x.id===cur.after)}return false}

/* ---------- UI helpers ---------- */
const $=s=>document.querySelector(s);
let toastTimer;
function toast(msg){let el=$(".toast");if(!el){el=document.createElement("div");el.className="toast";el.setAttribute("role","status");document.body.appendChild(el)}el.textContent=msg;el.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.hidden=true,2600)}
function modal(html,bind){const L=$("#layer");L.innerHTML='<div class="scrim" id="scrim"><div class="modal" role="dialog" aria-modal="true">'+html+'</div></div>';
  const close=()=>L.innerHTML="";$("#scrim").addEventListener("click",e=>{if(e.target.id==="scrim"||e.target.closest("[data-close]"))close()});bind&&bind(close);
  const f=L.querySelector("input,select,button");f&&f.focus()}
function go(view,extra){Object.assign(S,{view},extra||{});render();window.scrollTo(0,0)}

  while(i<ds.length){const m=p(ds[i]).getMonth();let n=0;while(i+n<ds.length&&p(ds[i+n]).getMonth()===m)n++;h+='<th colspan="'+n+'"'+(p(ds[i]).getDay()===1?' class="wk"':'')+'>'+(n>=4?MONTHS[m]+" "+p(ds[i]).getFullYear():MO[m])+'</th>';i+=n}return h+'</tr>'}
function dayHeads(ds){return ds.map(d=>'<th class="dh'+(isWE(d)?" we":"")+(dow(d)===1?" wk":"")+(d===TODAY?" today":"")+'">'+DOW[dow(d)][0]+'<b>'+p(d).getDate()+'</b></th>').join("")}
function windowBar(){return '<div class="seg" role="group" aria-label="Scroll the calendar">'+
  '<button data-w="-1" aria-label="Previous week">‹ Week</button><button data-w="0">This week</button><button data-w="1" aria-label="Next week">Week ›</button></div>'+
  '<button class="btn" id="viewopts">View options</button>'}
function bindWindow(){document.querySelectorAll("[data-w]").forEach(b=>b.onclick=()=>{const w=+b.dataset.w;S.start=w?add(S.start,7*w):mondayOf(TODAY);render()});
  const v=$("#viewopts");v&&(v.onclick=viewOptions)}
function viewOptions(){
  modal('<h2>View options</h2><label class="field"><span>Go to the week of</span><input type="date" id="jump" value="'+S.start+'"></label>'+
    '<div class="field"><span>Weeks shown</span><div class="seg" role="group">'+[2,3,4,6].map(n=>'<button data-wk="'+n+'" aria-pressed="'+(n===S.weeks)+'">'+n+' weeks</button>').join("")+'</div></div>'+
    '<label class="chk"><input type="checkbox" id="hidewe"'+(S.hideWE?" checked":"")+'> Hide Saturdays and Sundays</label>'+
    '<div class="row"><span class="spacer"></span><button class="btn primary" data-close>Done</button></div>',
  ()=>{$("#jump").onchange=e=>{if(e.target.value){S.start=mondayOf(e.target.value);render()}};
    document.querySelectorAll("[data-wk]").forEach(b=>b.onclick=()=>{S.weeks=+b.dataset.wk;document.querySelectorAll("[data-wk]").forEach(x=>x.setAttribute("aria-pressed",x===b));save();render()});
    $("#hidewe").onchange=e=>{S.hideWE=e.target.checked;save();render()}})}
function rangeLabel(){const ds=[S.start,add(S.start,S.weeks*7-1)];return fmt(ds[0])+" – "+fmt(ds[1])+", "+p(ds[1]).getFullYear()}

/* ---------- Dashboard ---------- */
function visibleJobs(){return S.jobs.filter(j=>(S.filter==="all"||j.mode===S.filter)&&(S.superFilter==="all"||j.superId===S.superFilter))}
function renderDash(){
  const js=visibleJobs(),ds=days();
  let todayCount=0,critWeek=0;const wkEnd=add(mondayOf(TODAY),6);
  S.jobs.forEach(j=>j.tasks.forEach(t=>{for(const [d,v] of Object.entries(t.cells||{})){if(d===TODAY)todayCount++;if(v==="R"&&d>=TODAY&&d<=wkEnd)critWeek++}}));
  const admin=isAdmin(),both=S.jobs.some(j=>j.mode==="res")&&S.jobs.some(j=>j.mode==="com");if(!both)S.filter="all";
  let h='<div class="row"><div><div class="eyebrow">'+esc(S.demo?"Demo mode · nothing is saved to the server":(admin?S.me.name+" · admin, every super’s jobs":isViewer()?S.me.name+" · view only · "+SCOPE[S.me.scope||"all"]:"Only you can see and change these"))+'</div><h1>'+(S.demo||admin||isViewer()?(isViewer()&&S.me.scope!=="all"?SCOPE[S.me.scope]+" jobs":"All jobs"):esc(firstName())+"’s jobs")+'</h1></div><span class="spacer"></span>'+

    '<div class="stats"><div class="stat"><b class="num">'+S.jobs.length+'</b><span>Active jobs</span></div><div class="stat"><b class="num">'+todayCount+'</b><span>Tasks today</span></div><div class="stat"><b class="num" style="color:var(--red)">'+critWeek+'</b><span>Critical items left this week</span></div></div>'+

function ganttHTML(js,ds){
  let h='<div class="scroller"><table class="grid"><thead>'+monthHeader(ds,1)+'<tr class="dy"><th class="stick g-job" style="text-align:left">Job</th>'+dayHeads(ds)+'</tr></thead><tbody>';

    h+='<tr class="jobrow" data-job="'+j.id+'"><th class="stick g-job" style="text-align:left"><div class="nm"><span class="dot" style="background:'+j.color+'"></span>'+esc(j.name)+'</div>'+
      '<div class="sub"><span class="num">'+esc(j.number)+'</span><span class="pill'+(j.mode==="res"?" res":"")+'">'+L.kind+'</span>'+(canLead()&&superName(j.superId)?'<span>'+esc(superName(j.superId))+'</span>':'')+(sentThisWeek(j)?'<span class="sent">✓ SENT</span>':'')+'</div>'+

    ds.forEach(d=>{let b=0,r=0;tasks.forEach(t=>{const v=t.cells[d];if(v==="B")b++;else if(v==="R")r++});const n=b+r;
      h+='<td class="d sum'+(r?" sr":n?" sb":"")+(isWE(d)?" we":"")+(dow(d)===1?" wk":"")+(d===TODAY?" today":"")+'" title="'+esc(j.name)+" · "+fmtLong(d)+": "+n+' task(s)">'+(n?'<i></i>'+(n>1?'<em>'+n+'</em>':''):"")+'</td>'});
    h+='</tr>';
    if(open)tasks.forEach(t=>{h+='<tr class="taskrow" data-job="'+j.id+'"><th class="stick" title="'+esc(t.name)+'">'+esc(t.name)+'</th>';

  });
  return h+'</tbody></table></div><p class="hint" style="margin-top:8px">Each bar shows the days a job has work scheduled; the number is how many tasks run that day. Red means something critical is due. Tap a job to open its look-ahead.</p>';
}
function dayItems(js,d){const out=[];js.forEach(j=>j.tasks.forEach(t=>{const v=t.cells&&t.cells[d];if(v)out.push({j,t,v})}));out.sort((a,b)=>(a.v===b.v?0:a.v==="R"?-1:1));return out}
function weekHTML(js){const ds=[];for(let i=0;i<7;i++){const d=add(S.start,i);if(S.hideWE&&isWE(d))continue;ds.push(d)}

/* ---------- Overview for leaders (VP: every job; general superintendents: their job type) ---------- */

    '<div class="tiles"><div class="tile"><span>Active jobs</span><b class="num">'+js.length+'</b></div><div class="tile"><span>Supers</span><b class="num">'+people.size+'</b></div>'+

    '<div class="tile"><span>Not updated 7+ days</span><b class="num"'+(old.length?' style="color:#B4540C"':'')+'>'+old.length+'</b></div></div>';
  if(sc==="all"){h+='<div class="split">'+["com","res"].map(m=>{const g=js.filter(j=>j.mode===m),sp=new Set(g.map(owner));
    return '<section class="panel"><h3>'+SCOPE[m]+'</h3><dl><dt>Jobs</dt><dd class="num">'+g.length+'</dd><dt>Supers</dt><dd class="num">'+sp.size+'</dd><dt>Tasks running this week</dt><dd class="num">'+g.reduce((n,j)=>n+tasksIn(j,wk0,wk1),0)+'</dd><dt>Critical, next 7 days</dt><dd class="num" style="color:var(--red)">'+g.reduce((n,j)=>n+cellsIn(j,TODAY,in7,"R"),0)+'</dd><dt>Sent this week</dt><dd class="num">'+g.filter(sentThisWeek).length+' / '+g.length+'</dd></dl></section>'}).join("")+'</div>'}
  /* workload: one row per super, a heat strip of how many tasks they have running each day */
  const rows=[...people.values()].map(x=>({...x,day:ds.map(d=>{let n=0,r=false;x.jobs.forEach(j=>j.tasks.forEach(t=>{const v=t.cells&&t.cells[d];if(v){n++;if(v==="R")r=true}}));return {n,r}})}));

    (rows.length?rows.map(x=>'<tr'+(x.id?' data-sup="'+x.id+'"':'')+'><th class="stick wh"><div style="font-weight:700">'+esc(x.name)+'</div><div class="hint">'+(x.last?"Updated "+fmt(x.last)+(x.last<stale?' <span class="warn">· stale</span>':''):"Not updated yet")+'</div></th>'+

  close=>{$("#as-role").onchange=e=>{$("#as-scope-f").hidden=e.target.value!=="viewer";$("#as-div-f").hidden=e.target.value!=="super"};

    if(role==="super"&&!$("#as-div").value){$("#as-div").focus();toast("Pick Restoration, Commercial or Both");return}
    try{const code=await rpc("la_add_person",{p_code:S.code,p_name:name,p_role:role,p_scope:role==="viewer"?$("#as-scope").value:role==="super"?$("#as-div").value:"all"});showLink(name,code)}

/* ---------- Mileage reimbursement ----------
   Each person logs their own trips (saved to the server, kept on the iPad until it gets there).
   Print fills the company Mileage Reimbursement Form PDF, 20 trips a page, each page with its own totals. */
const RATE=0.70,ROWS=20,FORM_PDF="forms/mileage-reimbursement-2026.pdf",PDFLIB_SRC="vendor/pdf-lib.min.js";
const M={key:null,trips:[],dirty:[],pulled:false,month:TODAY.slice(0,7)};
const tripKey=()=>cacheKey()+":trips";
function loadTrips(){M.trips=[];M.dirty=[];M.pulled=false;try{const d=JSON.parse(ls.get(tripKey())||"null");if(d){M.trips=d.trips||[];M.dirty=d.dirty||[]}}catch(e){}}
function persistTrips(){ls.set(tripKey(),JSON.stringify({trips:M.trips,dirty:M.dirty}))}
const num=v=>{if(v==null||v==="")return null;const n=parseFloat(String(v).replace(/[,$\s]/g,""));return isFinite(n)?n:null};
const round=(n,d)=>Math.round(n*Math.pow(10,d))/Math.pow(10,d);
const money=n=>"$"+round(n||0,2).toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g,",");
const mi=n=>round(+n||0,1).toLocaleString("en-US");
const odo=n=>n==null||n===""?"":(+n).toLocaleString("en-US",{maximumFractionDigits:1});
const mdy=s=>{const d=p(s);return (d.getMonth()+1)+"/"+d.getDate()+"/"+d.getFullYear()};
const tripCost=t=>round((+t.miles||0)*(t.rate==null?RATE:+t.rate),2);
const tripDesc=t=>[t.job,t.notes].filter(Boolean).join(" – ");
const tripSort=(a,b)=>a.date<b.date?-1:a.date>b.date?1:(a.at||0)-(b.at||0);
const liveTrips=()=>M.trips.filter(t=>!t.removed).sort(tripSort);
const jobLabel=j=>[j.number,j.name].filter(Boolean).join(" ");
const monthEnd=m=>add(add(m+"-01",32).slice(0,7)+"-01",-1);
const monthName=m=>MONTHS[+m.slice(5)-1]+" "+m.slice(0,4);
function saveTrip(t){const i=M.trips.findIndex(x=>x.id===t.id);if(i<0)M.trips.push(t);else M.trips[i]=t;if(!M.dirty.includes(t.id))M.dirty.push(t.id);persistTrips();syncTrips()}
let tripSyncing=false,tripTimer=null;
async function syncTrips(){
  if(tripSyncing||S.demo||!S.code)return;tripSyncing=true;clearTimeout(tripTimer);
  try{while(M.dirty.length){const id=M.dirty[0],t=M.trips.find(x=>x.id===id);if(!t){M.dirty.shift();continue}
      const sent=JSON.stringify(t);await rpc("la_save_trip",{p_code:S.code,p_trip:t});
      const now=M.trips.find(x=>x.id===id);if(now&&JSON.stringify(now)!==sent)continue; /* edited while sending: send again */
      M.dirty.shift();if(t.removed)M.trips=M.trips.filter(x=>x.id!==id);persistTrips()}
  }catch(e){if(/access code/i.test(e.message)){tripSyncing=false;signOut("Your access code no longer works. Ask Liam for a new one.");return}tripTimer=setTimeout(syncTrips,15000)}
  finally{tripSyncing=false}}
window.addEventListener("online",()=>{if(M.dirty.length)syncTrips()});
async function pullTrips(){const server=await rpc("la_get_trips",{p_code:S.code})||[];
  /* trips not yet on the server win over the server copy */
  const mine=M.trips.filter(t=>M.dirty.includes(t.id));
  M.trips=server.reverse().map((t,i)=>({...t,at:i})).filter(t=>!mine.some(x=>x.id===t.id)).concat(mine);persistTrips();if(M.dirty.length)syncTrips()}
function renderMiles(){
  if(M.key!==tripKey()){M.key=tripKey();loadTrips()}
  if(!M.pulled&&!S.demo&&S.code){M.pulled=true;pullTrips().then(()=>{if(S.view==="miles")renderMiles()}).catch(()=>{M.pulled=false})}
  const ts=liveTrips().filter(t=>t.date.slice(0,7)===M.month),miles=ts.reduce((n,t)=>n+(+t.miles||0),0),amt=ts.reduce((n,t)=>n+tripCost(t),0);
  let h='<div class="row"><div><div class="eyebrow">'+esc(S.me.name)+' · '+money(RATE)+' a mile</div><h1>Mileage reimbursement</h1></div><span class="spacer"></span>'+
    '<button class="btn" id="mprint">Print form…</button><button class="btn primary big" id="madd">+ Add trip</button></div>'+
    '<div class="toolbar"><div class="seg" role="group" aria-label="Month"><button data-mm="-1">‹</button><button data-mm="0" aria-pressed="true">'+monthName(M.month)+'</button><button data-mm="1">›</button></div>'+
    (M.dirty.length&&!S.demo?'<span class="hint">'+M.dirty.length+' trip'+(M.dirty.length===1?"":"s")+' saved on this device, not sent yet</span>':'')+'</div>'+
    '<div class="tiles"><div class="tile"><span>Trips</span><b class="num">'+ts.length+'</b></div><div class="tile"><span>Miles</span><b class="num">'+mi(miles)+'</b></div><div class="tile"><span>Reimbursement</span><b class="num">'+money(amt)+'</b></div></div>';
  if(!ts.length)h+='<div class="panel" style="padding:18px"><p class="muted" style="margin:0">No trips in '+monthName(M.month)+' yet. Tap <b>+ Add trip</b> after each drive. When the month is done, tap <b>Print form…</b> to fill in the company mileage form.</p></div>';
  else h+='<div class="scroller"><table class="plain trips"><thead><tr><th>Date</th><th>From</th><th>To</th><th>Job / notes</th><th class="r">Odometer</th><th class="r">Miles</th><th class="r">Amount</th></tr></thead><tbody>'+
    ts.map(t=>'<tr data-trip="'+t.id+'"><td class="num">'+fmt(t.date)+'</td><td>'+esc(t.from)+'</td><td>'+esc(t.to)+'</td><td>'+esc(tripDesc(t))+'</td><td class="r num muted">'+(t.odoStart!=null||t.odoEnd!=null?odo(t.odoStart)+' – '+odo(t.odoEnd):'')+'</td><td class="r num">'+mi(t.miles)+'</td><td class="r num">'+money(tripCost(t))+'</td></tr>').join("")+
    '</tbody></table></div><p class="hint" style="margin-top:8px">Tap a trip to change or delete it.</p>';
  $("#app").innerHTML=h;
  document.querySelectorAll("[data-mm]").forEach(b=>b.onclick=()=>{const n=+b.dataset.mm;M.month=n?add(M.month+"-15",n*30).slice(0,7):TODAY.slice(0,7);render()});
  $("#madd").onclick=()=>tripDialog(null);$("#mprint").onclick=()=>printMilesDialog();
  document.querySelectorAll("[data-trip]").forEach(r=>r.onclick=()=>tripDialog(M.trips.find(t=>t.id===r.dataset.trip)));
}
function tripDialog(t,preset){
  const isNew=!t,last=liveTrips().sort((a,b)=>(a.at||0)-(b.at||0)).slice(-1)[0]; /* the trip entered last */
  t=t?{...t}:Object.assign({id:uid(),date:TODAY.slice(0,7)===M.month?TODAY:M.month+"-01",from:last?last.to:"",to:"",jobId:null,job:"",notes:"",odoStart:last&&last.odoEnd!=null?last.odoEnd:null,odoEnd:null,miles:0,rate:RATE,at:Date.now()},preset||{});
  const places=[...new Set(liveTrips().reverse().flatMap(x=>[x.to,x.from]).filter(Boolean))].slice(0,40);
  const jobs=S.jobs.filter(j=>jobLabel(j));
  const inp=(id,label,val,extra)=>'<label class="field"><span>'+label+'</span><input type="text" id="'+id+'" value="'+esc(val==null?"":val)+'"'+(extra||"")+'></label>';
  modal('<h2>'+(isNew?"Add a trip":"Trip on "+fmtLong(t.date))+'</h2>'+
    '<label class="field"><span>Date</span><input type="date" id="t-date" value="'+t.date+'"></label>'+
    inp("t-from","Starting location",t.from,' list="t-places" autocomplete="off"')+inp("t-to","Destination address",t.to,' list="t-places" autocomplete="off"')+
    '<datalist id="t-places">'+places.map(x=>'<option value="'+esc(x)+'">').join("")+'</datalist>'+
    '<label class="field"><span>Job</span><select id="t-job"><option value="">No job</option>'+jobs.map(j=>'<option value="'+j.id+'"'+(j.id===t.jobId?" selected":"")+'>'+esc(jobLabel(j))+'</option>').join("")+
      (t.jobId&&!jobs.some(j=>j.id===t.jobId)||(!t.jobId&&t.job)?'<option value="keep" selected>'+esc(t.job)+'</option>':'')+'</select></label>'+
    inp("t-notes","What for (optional)",t.notes,' placeholder="Pick up materials, site walk…"')+
    '<div class="row" style="flex-wrap:nowrap">'+inp("t-os","Odometer start",t.odoStart,' inputmode="decimal"')+inp("t-oe","Odometer end",t.odoEnd,' inputmode="decimal"')+'</div>'+
    inp("t-mi","Miles",t.miles||"",' inputmode="decimal"')+
    '<p class="hint" id="t-sum" style="margin:0"></p><div id="t-err" class="err" hidden></div>'+
    '<div class="row">'+(isNew?'':'<button class="btn danger" id="t-del">Delete</button>')+'<span class="spacer"></span><button class="btn" data-close>Cancel</button>'+
    '<button class="btn" id="t-ret">Save + return trip</button><button class="btn primary" id="t-save">Save trip</button></div>',
  close=>{
    const os=$("#t-os"),oe=$("#t-oe"),m=$("#t-mi");
    const upd=()=>{const a=num(os.value),b=num(oe.value);if(a!=null&&b!=null&&b>=a)m.value=String(round(b-a,1));m.readOnly=a!=null&&b!=null;
      const n=num(m.value)||0;$("#t-sum").textContent=n?mi(n)+" miles × "+money(RATE)+" = "+money(n*RATE):"Enter both odometer readings, or just the miles."};
    os.oninput=oe.oninput=m.oninput=upd;upd();
    const collect=()=>{const er=$("#t-err"),a=num(os.value),b=num(oe.value),miles=num(m.value),js=$("#t-job").value,j=S.jobs.find(x=>x.id===js);
      const fail=msg=>{er.hidden=false;er.textContent=msg;return null};
      if(!$("#t-date").value)return fail("Pick the date of the trip.");
      if(a!=null&&b!=null&&b<a)return fail("The odometer end is lower than the start.");
      if(!miles||miles<=0)return fail("Enter the miles, or both odometer readings.");
      return {...t,date:$("#t-date").value,from:$("#t-from").value.trim(),to:$("#t-to").value.trim(),
        jobId:j?j.id:js==="keep"?t.jobId:null,job:j?jobLabel(j):js==="keep"?t.job:"",notes:$("#t-notes").value.trim(),
        odoStart:a,odoEnd:b,miles:round(miles,1),rate:t.rate==null?RATE:t.rate}};
    const done=x=>{saveTrip(x);M.month=x.date.slice(0,7);close();render()};
    $("#t-save").onclick=()=>{const x=collect();if(x){done(x);toast("Trip saved")}};
    $("#t-ret").onclick=()=>{const x=collect();if(!x)return;done(x);
      tripDialog(null,{date:x.date,from:x.to,to:x.from,jobId:x.jobId,job:x.job,notes:x.notes,odoStart:x.odoEnd,odoEnd:null,miles:x.odoEnd==null?x.miles:0})};
    const d=$("#t-del");d&&(d.onclick=()=>{saveTrip({...t,removed:true});close();render();toast("Trip deleted")});
  })}
let pdfLibP=null;
function loadPDFLib(){if(window.PDFLib)return Promise.resolve(window.PDFLib);
  return pdfLibP=pdfLibP||new Promise((ok,no)=>{const sc=document.createElement("script");sc.src=PDFLIB_SRC;sc.onload=()=>ok(window.PDFLib);sc.onerror=()=>{pdfLibP=null;no(new Error("Couldn’t load the form. Check your connection and try again."))};document.head.appendChild(sc)})}
/* Fills the form's own fields, then flattens each page so it prints the same everywhere. */
async function mileagePDF(trips,name){
  const PL=await loadPDFLib(),r=await fetch(FORM_PDF);if(!r.ok)throw new Error("Couldn’t load the form. Check your connection and try again.");
  const tpl=await r.arrayBuffer(),out=await PL.PDFDocument.create();
  for(let i=0;i<trips.length;i+=ROWS){const doc=await PL.PDFDocument.load(tpl),f=doc.getForm(),part=trips.slice(i,i+ROWS);
    const set=(n,v)=>{try{f.getTextField(n).setText(v==null?"":String(v))}catch(e){}};
    set("Employee Name",name);
    /* every row gets a value (blank ones too) so each field has a clean appearance when flattened */
    for(let n=1;n<=ROWS;n++)["DateRow","Starting LocationRow","Destination AddressRow","DescriptionNotesRow","Odometer StartRow","Odometer EndRow","MileageRow","ExpenseRow"].forEach(c=>set(c+n,""));
    part.forEach((t,k)=>{const n=k+1;set("DateRow"+n,mdy(t.date));set("Starting LocationRow"+n,t.from);set("Destination AddressRow"+n,t.to);set("DescriptionNotesRow"+n,tripDesc(t));
      set("Odometer StartRow"+n,odo(t.odoStart));set("Odometer EndRow"+n,odo(t.odoEnd));set("MileageRow"+n,mi(t.miles));set("ExpenseRow"+n,money(tripCost(t)))});
    set("0575Row1",mi(part.reduce((n,t)=>n+(+t.miles||0),0)));set("0575Row2",money(part.reduce((n,t)=>n+tripCost(t),0)));
    f.updateFieldAppearances(await doc.embedFont(PL.StandardFonts.Helvetica));f.flatten();
    (await out.copyPages(doc,doc.getPageIndices())).forEach(pg=>out.addPage(pg))}
  out.setTitle("Mileage Reimbursement – "+name);return out.save()}
function printMilesDialog(){
  const from0=M.month+"-01",to0=monthEnd(M.month);
  modal('<h2>Print mileage form</h2><p class="muted" style="margin:0">Fills in the company Mileage Reimbursement Form with your trips. Each page holds 20 trips and has its own totals.</p>'+
    '<div class="row" style="flex-wrap:nowrap"><label class="field"><span>From</span><input type="date" id="pm-a" value="'+from0+'"></label><label class="field"><span>To</span><input type="date" id="pm-b" value="'+to0+'"></label></div>'+
    '<p class="hint" id="pm-sum" style="margin:0"></p><div id="pm-out" class="row"></div>'+
    '<div class="row"><span class="spacer"></span><button class="btn" data-close>Close</button><button class="btn primary" id="pm-go">Make the form</button></div>',
  close=>{const pick=()=>{const a=$("#pm-a").value,b=$("#pm-b").value;return liveTrips().filter(t=>t.date>=a&&t.date<=b)};
    const upd=()=>{const ts=pick(),pages=Math.ceil(ts.length/ROWS);$("#pm-out").innerHTML="";$("#pm-go").hidden=false;
      $("#pm-sum").textContent=ts.length?ts.length+" trip"+(ts.length===1?"":"s")+", "+mi(ts.reduce((n,t)=>n+(+t.miles||0),0))+" miles, "+money(ts.reduce((n,t)=>n+tripCost(t),0))+" · "+pages+" page"+(pages===1?"":"s"):"No trips in these dates."};
    $("#pm-a").onchange=$("#pm-b").onchange=upd;upd();
    $("#pm-go").onclick=async()=>{const ts=pick(),b=$("#pm-go");if(!ts.length){toast("No trips in these dates");return}
      b.disabled=true;b.textContent="Filling in…";
      try{const bytes=await mileagePDF(ts,S.me.name),url=URL.createObjectURL(new Blob([bytes],{type:"application/pdf"}));
        const file="Mileage "+$("#pm-a").value+" to "+$("#pm-b").value+" - "+S.me.name+".pdf";
        $("#pm-out").innerHTML='<a class="btn primary big" href="'+url+'" target="_blank" rel="noopener">Open to print</a><a class="btn big" href="'+url+'" download="'+esc(file)+'">Save PDF</a>';
        $("#pm-sum").textContent+=" · Ready. Sign it, and have your manager sign, after printing.";b.hidden=true}
      catch(e){toast(e.message)}finally{b.disabled=false;b.textContent="Make the form"}}})}

function renderLogin(msg){
  $("#app").innerHTML='<form class="login panel" id="lf" style="padding:24px"><div class="eyebrow">Superintendent sign-in</div><h1>3-Week Look-Ahead</h1>'+
    '<p class="muted" style="margin:0">Open the sign-in link Liam texted you, or type the 8-letter code from it here. You only do this once on each iPad.</p>'+
    '<input type="text" id="code" autocomplete="one-time-code" autocapitalize="characters" spellcheck="false" maxlength="16" placeholder="ACCESS CODE" aria-label="Access code">'+
    (msg?'<div class="err">'+esc(msg)+'</div>':'')+'<button class="btn primary" type="submit" style="justify-content:center">Sign in</button>'+
    '<button class="btn ghost" type="button" id="demo" style="justify-content:center">Try it with sample jobs (not saved)</button></form>';
  $("#lf").onsubmit=async e=>{e.preventDefault();const c=$("#code").value.trim().toUpperCase();if(!c)return;const b=$("#lf button[type=submit]");b.disabled=true;b.textContent="Signing in…";
    try{await signIn(c)}catch(err){renderLogin(/access code/i.test(err.message)?"That code didn’t work. Check it and try again.":"Couldn’t reach the server. Check your connection and try again.")}};
  $("#demo").onclick=()=>{S.demo=true;S.me={name:"Superintendent A",isAdmin:false};S.supers=[];if(!loadCache())S.jobs=seed();chrome();go("dash")};
  chrome();
}
async function signIn(c){const me=await rpc("la_login",{p_code:c});S.me=me;S.code=c;S.demo=false;ls.set(CODEKEY,c);ls.set(KEY+":me",JSON.stringify(me));setLinkHash(c);await startSignedIn()}
function chrome(){
  const inApp=!!S.me;$("#nav").hidden=!inApp;$("#who").hidden=!inApp;$("#navteam").hidden=!(S.me&&S.me.isAdmin);$("#navover").hidden=!(S.me&&canLead()&&!S.demo);
  if(inApp){$("#who").textContent=S.demo?"Demo · Sign in":S.me.name;}
  const nd=document.querySelector('[data-nav="dash"]');nd.textContent=S.me&&!canLead()?"My jobs":"All jobs";
  document.querySelector('[data-nav="sheets"]').textContent="Print sheets";
  setSync("","Saved")}
function signOut(msg){S.me=null;S.code=null;S.demo=false;S.jobs=[];S.synced={};S.archived=[];ls.del(CODEKEY);ls.del(KEY+":me");setLinkHash("");S.view="dash";renderLogin(msg)}
$("#who").onclick=()=>{if(S.demo){signOut();return}
  modal('<h2>'+esc(S.me.name)+'</h2><p class="muted">'+(pending()?'Some changes haven’t reached the server yet. Signing out now would lose them.':'Everything is saved.')+'</p><p class="muted">Your sign-in code is <b class="num">'+esc(S.code)+'</b>. Keep it in case the app ever asks.</p><div class="row"><span class="spacer"></span><button class="btn" data-close>Cancel</button><button class="btn danger" id="so">Sign out</button></div>',c=>{$("#so").onclick=()=>{c();signOut()}})};
async function startSignedIn(){
  loadCache();chrome();go(isViewer()?"over":"dash");
  try{await pull();render()}catch(e){if(/access code/i.test(e.message)){signOut("That access code no longer works.");return}setSync("off","No signal · showing saved copy")}
}
function render(){
  document.querySelectorAll("[data-nav]").forEach(b=>b.setAttribute("aria-current",String(b.dataset.nav===S.view)));
  if(!S.me){renderLogin();return}
  if(S.view==="job")renderJob();else if(S.view==="sheets")renderSheets();else if(S.view==="team")renderTeam();else if(S.view==="miles")renderMiles();else if(S.view==="over"&&canLead())renderOver();else renderDash();
}
document.querySelectorAll("[data-nav]").forEach(b=>b.onclick=()=>go(b.dataset.nav,b.dataset.nav==="sheets"?{sheetIds:null}:b.dataset.nav==="dash"?{superFilter:"all"}:{}));
$("#home").onclick=()=>{if(S.me)go(isViewer()?"over":"dash")};
loadPrefs();
(function boot(){const c=ls.get(CODEKEY);let me=null;try{me=JSON.parse(ls.get(KEY+":me")||"null")}catch(e){}
  /* personal sign-in link: …/#k=CODE */
  const hk=((location.hash.match(/[#&]k=([A-Za-z0-9]{4,16})/)||[])[1]||"").toUpperCase();
  if(hk&&!(c===hk&&me)){$("#app").innerHTML='<div class="login panel" style="padding:24px"><h1>Signing you in…</h1></div>';
    signIn(hk).catch(err=>{if(c&&me&&!/access code/i.test(err.message)){S.code=c;S.me=me;startSignedIn();return}
      setLinkHash("");renderLogin(/access code/i.test(err.message)?"That sign-in link no longer works. Ask Liam for a new one.":"Couldn’t reach the server. Check your connection and open the link again.")});return}
  if(c&&me){S.code=c;S.me=me;setLinkHash(c);startSignedIn()}else renderLogin()})();
if("serviceWorker" in navigator&&location.protocol==="https:")navigator.serviceWorker.register("sw.js").catch(()=>{});
})();
